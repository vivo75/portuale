# Known, justified portuale-vs-real-Portage divergences on the
# *fixture* tree (TEST/run/l0-fixture-oracle.sh, backlog #49). Same
# schema as `known-divergences.yaml` (see its header for the field
# documentation); findings land here only after adjudication, and an
# `owner: portuale-bug` entry is a filed bug being suppressed so the
# layer can gate everything else.
#
# Keep this file sorted by id.

# -- presentation: the staging makes ROOT != "/", real appends
#    ` for <configroot>/` to its masked/unmet messages while portuale
#    (whose fixture env never has that suffix) does not.

- id: fixture-masked-path-suffix
  categories: [advice, error]
  slugs: ["*"]
  match: "for /tmp/l0-fixture-oracle/fixtures/"
  reason: >
    Real's masked-atom / unmet-requirements messages append the target
    configroot path when it is not "/"; the staged oracle copy must live
    outside / for the fixture vdb to be the target root, and portuale's
    own fixture harness has no such suffix. The compared content (atom,
    reason) is identical.
  owner: portuale-oracle

- id: fixture-masked-atom-synthesis
  category: advice
  slugs: ["*"]
  match: "masked-atom:"
  reason: >
    The comparator derives `masked-atom: <atom>` from the `"<atom>" have
    been masked` line; real's copy of that line carries the staging path
    suffix, so only portuale's yield the derived atom. Real's line is
    itself explained by `fixture-masked-path-suffix`; the atom set is the
    same.
  owner: portuale-oracle

- id: fixture-unmet-requirements-wording
  categories: [error]
  slugs: ["*"]
  match: "has unmet requirements."
  reason: >
    Real's unmet-requirements line carries the staged root suffix; both
    sides print the same sentence otherwise (the real-only `Problem
    resolving dependencies for X` header is covered by the same entry's
    sibling).
  owner: portuale-oracle

- id: fixture-problem-resolving-header
  categories: [error]
  slugs: ["*"]
  match: "Problem resolving dependencies for"
  reason: >
    Real prints a `!!! Problem resolving dependencies for <atom>` header
    before the unmet-requirements line; portuale prints the same failure
    without that header. Output wording, not resolver behaviour.
  owner: portuale-oracle

- id: fixture-masked-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "All ebuilds that could satisfy"
  reason: >
    Portuale's copy of the masked-atom message has no staging-path suffix
    (real's is explained by `fixture-masked-path-suffix`); the atom and
    the masked package set are the same.
  owner: portuale-oracle

- id: triangle-residual-conflict-exit
  category: exit
  slugs: ["dev-libs_needer_dev-libs_othermod"]
  match: "real rc=1 portuale rc=0"
  reason: >
    #54 S1 gated the installed-consumer reverse scan on required-set
    reachability, so keeper's pin (outside every reachable set here) no
    longer applies -- but portuale's residual-conflict block for this
    shape was entirely driven by that scan's dropped pins, and there is
    no independent mechanism for two directly-requested hard atoms
    (needer's `>=2.0`, othermod's `<2.0`) disagreeing on the same
    transitive dependency with no installed vdb consumer involved. Real
    still reports the conflict (installed 1.0 pulled in by othermod
    alone, exit 1); portuale merges all three silently, exit 0. Filed as
    backlog #57 (a second, narrower conflict-detection gap, out of #54's
    scope). See `triangle-residual-conflict-missing-block-*` for the
    block-content findings this same gap causes.
  owner: portuale-bug

- id: triangle-residual-conflict-suppressed-merge-list
  category: exit
  slugs: ["dev-libs_needer_dev-libs_othermod"]
  match: "merge-list comparison suppressed"
  reason: >
    The comparator suppresses merge-list comparison on the rc mismatch
    above; the two merge lists are identical (3 entries each, verified in
    the saved outputs).
  owner: portuale-bug

- id: triangle-residual-conflict-missing-block-header
  category: error
  slugs: ["dev-libs_needer_dev-libs_othermod"]
  match: "Multiple package instances within a single package slot have been pulled"
  reason: >
    Backlog #57 (see `triangle-residual-conflict-exit`): real reports the
    needer/othermod residual conflict via its ordinary two-hard-atom
    slot-conflict mechanism, independent of any installed vdb consumer;
    portuale's equivalent block is gated on `reverse_dependency_
    constraints`'s dropped pins only, so with keeper correctly excluded
    (#54 S1) it renders nothing for this shape.
  owner: portuale-bug

- id: triangle-residual-conflict-missing-block-second-line
  category: error
  slugs: ["dev-libs_needer_dev-libs_othermod"]
  match: "into the dependency graph, resulting in a slot conflict:"
  reason: >
    The second line of the #57 missing block (see
    `triangle-residual-conflict-missing-block-header`).
  owner: portuale-bug
