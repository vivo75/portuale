# Known, justified portuale-vs-real-Portage divergences on the
# *fixture* tree (TEST/run/l0-fixture-oracle.sh, backlog #49). Same
# schema as `known-divergences.yaml` (see its header for the field
# documentation); findings land here only after adjudication, and an
# `owner: portuale-bug` entry is a filed bug being suppressed so the
# layer can gate everything else.
#
# Keep this file sorted by id.

# -- presentation: the staging makes ROOT != "/", real appends
#    ` for <configroot>/` to its masked/unmet messages while portuale
#    (whose fixture env never has that suffix) does not.

- id: fixture-masked-path-suffix
  categories: [advice, error]
  slugs: ["*"]
  match: "for /tmp/l0-fixture-oracle/fixtures/"
  reason: >
    Real's masked-atom / unmet-requirements messages append the target
    configroot path when it is not "/"; the staged oracle copy must live
    outside / for the fixture vdb to be the target root, and portuale's
    own fixture harness has no such suffix. The compared content (atom,
    reason) is identical.
  owner: portuale-oracle

- id: fixture-masked-atom-synthesis
  category: advice
  slugs: ["*"]
  match: "masked-atom:"
  reason: >
    The comparator derives `masked-atom: <atom>` from the `"<atom>" have
    been masked` line; real's copy of that line carries the staging path
    suffix, so only portuale's yield the derived atom. Real's line is
    itself explained by `fixture-masked-path-suffix`; the atom set is the
    same.
  owner: portuale-oracle

- id: fixture-unmet-requirements-wording
  categories: [error]
  slugs: ["*"]
  match: "has unmet requirements."
  reason: >
    Real's unmet-requirements line carries the staged root suffix; both
    sides print the same sentence otherwise (the real-only `Problem
    resolving dependencies for X` header is covered by the same entry's
    sibling).
  owner: portuale-oracle

- id: fixture-problem-resolving-header
  categories: [error]
  slugs: ["*"]
  match: "Problem resolving dependencies for"
  reason: >
    Real prints a `!!! Problem resolving dependencies for <atom>` header
    before the unmet-requirements line; portuale prints the same failure
    without that header. Output wording, not resolver behaviour.
  owner: portuale-oracle

- id: fixture-masked-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "All ebuilds that could satisfy"
  reason: >
    Portuale's copy of the masked-atom message has no staging-path suffix
    (real's is explained by `fixture-masked-path-suffix`); the atom and
    the masked package set are the same.
  owner: portuale-oracle

- id: triangle-residual-conflict-exit
  category: exit
  slugs: ["dev-libs_needer_dev-libs_othermod", "dev-libs_othermod_dev-libs_needer"]
  match: "real rc=1 portuale rc=0"
  reason: >
    Deliberate convention, not a bug: portuale renders the slot-conflict
    notice as *informational* and keeps exit 0, where real exits 1 (see
    the `pretend.rs` slot-conflict renderer's own doc comment and #54 K1
    / #57 K1, decided 2026-09-16). Since #57 S1 the block itself matches
    -- portuale reports the same `dev-libs/paired:0` collision between
    installed 1.0 (pulled in by othermod) and merge 2.0 (pulled in by
    needer), in both argv orders -- so only the exit status differs.
    Backlog #60 tracks revisiting the convention in a future release
    (breaking change, needs a migration story for anything relying on
    rc 0).
  owner: claude-opus-5

- id: triangle-residual-conflict-suppressed-merge-list
  category: exit
  slugs: ["dev-libs_needer_dev-libs_othermod", "dev-libs_othermod_dev-libs_needer"]
  match: "merge-list comparison suppressed"
  reason: >
    The comparator suppresses merge-list comparison on the rc mismatch
    above (`triangle-residual-conflict-exit`, the K1 convention); the two
    merge lists are identical (3 entries each, verified in the saved
    outputs and pinned by
    `test_needer_othermod_triangle_reports_the_installed_instance_conflict`).
  owner: claude-opus-5

# -- #65 S0/S1/S2 + #71: the slot-operator bdeps matrix (FX_SLOTOP_BDEP=1
#    FX_HOST_ROOTS=1, TEST/atomlists/l0-fixture-oracle-slotop.txt). The
#    two artifact entries (totals duplication, the considep extra) were
#    deleted by the #71 S1 re-scope: with host-exact roots real and
#    portuale agree on set and Total: in every argument/option cell.
#    What remains is a genuine merge-order divergence in the three
#    @world cells (below).

- id: slotop-world-complete-graph-order
  category: order
  slugs:
    ["-uDvN__world", "-uDvN_--usepkg__world", "-uDvN_--with-bdeps_y__world"]
  match: "merge order diverges"
  reason: >
    Standing merge-order class (#17, deliberate cut): in the staged
    matrix's `@world` shape real's complete-graph rebuild order is
    `consbdep, consdep, considep, conspdep, consrdep` (the order its
    `_complete_graph` `_unsatisfied_deps` re-probe reaches them) while
    portuale emits them in dependency-discovery order
    `consrdep, consdep, consbdep, conspdep, considep`. The set and the
    `Total:` row match; only the sequence differs, the same family as
    the host L0 "order" findings. Adjudicated here so the slotop matrix
    can run host-exact; a merge-order port is #17's parked work, not
    #71's. See `TEST/findings/l0.md` "#71 S1".
  owner: portuale

# -- #79 D1: the reverse-dependency pin fixture
#    (FX_WORLD_EXTRA=dev-libs/rdctarget,
#    TEST/atomlists/l0-fixture-oracle-rdcpin.txt). A filed portuale bug
#    being suppressed so the layer stays green until D2 fixes it; the
#    `owner: portuale-bug` entries are removed in D2.

- id: d1-rdcpin-drops-the-blocker-merge
  category: exit
  slugs: ["--update_--deep_--newuse_--oneshot_dev-libs_rdcpuller"]
  match: "real rc=1 portuale rc=0"
  reason: >
    Portuale's `reverse_dependency_constraints` scan enforces the
    installed `dev-libs/rdctarget-1.0`'s recorded
    `~dev-libs/rdcblocker-1.0` pin when `rdcblocker` is upgrading, so
    `rdcblocker-2.0` is dropped and no block is reported (rc 0). Real
    keeps the merge and reports `[blocks B] <dev-libs/rdctarget-2.0`
    (the installed consumer is an @selected digraph node, so it cannot
    be uninstalled), rc 1. Backlog #79; D2 removes this entry.
  owner: portuale-bug

- id: d1-rdcpin-suppressed-merge-list
  category: exit
  slugs: ["--update_--deep_--newuse_--oneshot_dev-libs_rdcpuller"]
  match: "merge-list comparison suppressed"
  reason: >
    The comparator suppresses merge-list comparison on the rc mismatch
    above; real's list is `rdcblocker-2.0` + `rdcpuller-2.0` + the
    `[blocks B]` row, portuale's is `rdcpuller-2.0` alone. Backlog #79;
    D2 removes this entry.
  owner: portuale-bug

# -- #84: two new slots of one cp, pulled by different parents, merge in
#    the opposite order. Found while building #82's tree fixture; the
#    tree edge set itself matches real after #82, only the sequence the
#    reversed display list walks does not.

- id: treeslot-new-slot-merge-order
  category: order
  slugs: ["-v_dev-libs_treeslotuser"]
  match: "merge order diverges"
  reason: >
    Real merges `dev-libs/treeslotpkg-1.9` (SLOT 0, reached through
    `treeslotuser`'s own `:0` atom) before `-1.10` (SLOT 1, reached
    through `treeslotparent`); portuale's `build_digraph` discovery order
    reaches the slot-1 node first and emits `1.10, 1.9`. Set, versions,
    flags and `Total:` all match -- only the sequence differs, the
    standing #17 merge-order class. It is what keeps the `--tree` cell
    of the same shape from being byte-equal to real (the reversed
    display list walks the merge order), so #82's tree fix cannot be
    pinned end-to-end until this closes. Backlog #84; see
    `TEST/findings/l0.md` "#82".
  owner: portuale-bug
