# Known, justified Portuale-vs-Portage divergences.
#
# A finding produced by a comparator (resolve-compare.py for L0; diff.py
# for L1+) is *explained* when it matches an entry here; a run is GREEN
# iff every finding is explained. New unexplained findings must be
# triaged into one of:
#   * Portuale bug   -> fix it, do not add an entry
#   * Portage bug    -> add an entry with a `ticket:`, report upstream
#   * environmental  -> add an entry with a `reason:` (nondeterminism,
#                       host state, a deliberate Portuale design cut)
#
# Entry schema (all keys optional except that an entry must constrain
# *something* -- an entry that constrains nothing matches nothing):
#
#   id:         short kebab-case handle (shown in reports)
#   layer:      l0 | l1 | l2 | l3 | l4 | l5   (default l0)
#   categories: [missing, extra, version, flags, use, order, error,
#                exit, totals, advice]  -- or `category:` for a single one
#                (`advice` = a needed USE change / mask / REQUIRED_USE
#                 diagnostic that only one side emits)
#   slugs:      list of probe-slug globs (e.g. "app-editors_vim",
#               "MULTI_*"); '*' is the only wildcard
#   match:      substring that must appear in the finding detail
#   reason:     why this is not a Portuale bug   (required in spirit)
#   ticket:     upstream/issue reference, if any
#   owner:      who adjudicated it
#
# Keep this file sorted by id. Every entry is a deliberate, reviewed
# decision. An entry tagged `owner: portuale-bug` is a KNOWN bug being
# suppressed only so the layer can still gate *other* changes -- it must
# be deleted the moment the bug is fixed (see the finding it names).

# (empty -- L1-c fixed on `main`; the `l1-env-binpkg-not-refiltered`
#  entry that stood here is gone. The L1-f phase-env-inheritance residue
#  is handled by normalize.py's ENV_DROP, not an allowlist entry.)

- id: gnome-shell-cluster-a-abort
  categories: [order, extra, totals, advice, error]
  slugs: ["gnome-base_gnome-shell"]
  reason: >
    Cluster-A abort-path bundle, not a #17 order bug: real abandons the
    resolve at the unsatisfiable USE-dep (`emerge: there are no ebuilds
    built with USE flags to satisfy ">=net-fs/samba-4.0.0[client]"`, the
    masked-required notice, rc 1) and prints a truncated merge list
    (Total 453). Portuale keeps going with an autounmask USE change
    (libcanberra pulseaudio) and exits 1 later (Total 454), so the
    `order #0` (real sys-apps/hwdata vs portuale app-crypt/libmd), the
    extra dev-lang/nasm row and the totals delta are downstream of the
    abort handling. Recorded as the gnome-shell cluster-A bundle in
    TEST/findings/l0.md (~948-952).
  owner: deepseek-v4.1-flash

# ---------------------------------------------------------------------
# L2 (portuale as builder) -- temporary adjudications, 2026-09-13.
# Every entry below is a filed *producer* gap with evidence in
# TEST/findings/l2.md. All are `owner: portuale-bug` in spirit (the
# schema's rule applies: delete the entry the moment the gap is fixed);
# they exist only so the L2 bed can gate everything else while the gap
# is open.

- id: l2-gpkg-metadata-members
  layer: l2
  categories: [VDB]
  path_glob:
    - "porttest/*/IUSE"
    - "porttest/*/IUSE_EFFECTIVE"
    - "porttest/*/REPO_REVISIONS"
    - "porttest/*/SIZE"
    - "porttest/*/repository"
    - "porttest/*/RDEPEND"
    - "porttest/*/REQUIRES"
    - "porttest/*/PROVIDES"
    - "porttest/*/NEEDED"
    - "porttest/*/NEEDED.ELF.2"
  reason: >
    portuale's gpkg `metadata/` member set is incomplete vs real (SIZE,
    IUSE, IUSE_EFFECTIVE, repository, REPO_REVISIONS, and the
    ebuild-derived *DEPEND / scanelf NEEDED* keys); the merged VDB then
    lacks them. Filed as l2-gpkg-metadata-members.
  owner: portuale-bug

- id: l2-bpkgonly-env
  layer: l2
  categories: [VDB, MISSING]
  path_glob:
    - "porttest/*/FEATURES"
    - "porttest/*/USE"
    - "porttest/*/environment"
    - "porttest/*/metadata"
    - "/var/lib/porttest/kept/*"
  reason: >
    `emerge --buildpkgonly` builds with the standalone ebuild env, not
    the resolved graph env (raw env FEATURES, empty USE, no SLOT, no
    PORTAGE_REPO_NAME); `.keep_...-<slot>` markers and the saved
    environment inherit that. Filed as l2-bpkgonly-env.
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug
  layer: l2
  categories: [MISSING, SIZE, CONTENT]
  path_glob:
    - "/usr/lib/debug"
    - "/usr/lib/debug/*"
    - "/usr/lib/libptsd*"
    - "/usr/lib64/libptsd*"
    - "/usr/bin/pt-*"
  reason: >
    portuale's packaging path runs no `dostrip`/`splitdebug`: archives
    ship unstripped binaries and no /usr/lib/debug objects. Filed as
    l2-gpkg-dostrip-splitdebug.
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-contents
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "/usr/bin/pt-"
  reason: "CONTENTS md5/entry residue of l2-gpkg-dostrip-splitdebug."
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-libptsd
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "/usr/lib/libptsd"
  reason: "CONTENTS entry residue of l2-gpkg-dostrip-splitdebug."
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-dirs
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "line: dir /usr/lib/debug"
  reason: "CONTENTS dir residue of l2-gpkg-dostrip-splitdebug."
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-libdir
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "line: dir /usr/lib"
  reason: >
    The bare `dir /usr/lib` line exists only because splitdebug targets
    live under /usr/lib/debug (l2-gpkg-dostrip-splitdebug); the
    `/usr/lib/debug` lines are claimed by
    l2-gpkg-dostrip-splitdebug-dirs, listed first.
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-lib64
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "/usr/lib64/libptsd"
  reason: "CONTENTS entry residue of l2-gpkg-dostrip-splitdebug."
  owner: portuale-bug

- id: l2-gpkg-docompress
  layer: l2
  categories: [MISSING]
  path_glob: "/usr/share/doc/docs-1.0/BIG.txt*"
  reason: >
    No `docompress`/`ecompress`: portuale archives ship BIG.txt where
    real ships BIG.txt.bz2. Filed as l2-gpkg-docompress.
  owner: portuale-bug

- id: l2-gpkg-docompress-contents
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: "BIG.txt"
  reason: "CONTENTS entry residue of l2-gpkg-docompress."
  owner: portuale-bug

- id: l2-bpkgonly-keep-contents
  layer: l2
  category: CONTENTS
  path_glob: "porttest/*/CONTENTS"
  match: ".keep_porttest_emptydirs-"
  reason: "CONTENTS entry residue of l2-bpkgonly-env (SLOT not set)."
  owner: portuale-bug

- id: l2-consumes-portuale-env-degraded
  layer: l2
  categories: [SIZE, CONTENT]
  path_glob: "/var/lib/porttest/phase.log"
  reason: >
    Real Portage merging a portuale-built archive runs merge phases with
    a degraded saved env (no MERGE_TYPE, pkg_pretend skipped), so the
    phases fixture's log is shorter. Filed as
    l2-consumes-portuale-env-degraded.
  owner: portuale-bug
