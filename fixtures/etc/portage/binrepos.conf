# fixture binrepos.conf for --getbinpkg/--getbinpkgonly (real
# lib/portage/binrepo/config.py). A single binhost whose "Packages"
# index lives at <sync-uri>/Packages. `${PORTAGE_CONFIGROOT}` expands
# from the env (portuale's parse_binrepos convenience) so this fixture
# tree stays relocatable; --pretend never downloads anyway.
[testbinhost]
sync-uri = file://${PORTAGE_CONFIGROOT}/binhost
priority = 1
