# Third-party repositories this fork tracks or vendors, and the exact
# ref/commit each is currently pinned to.
#
# One [table] per repository. Required keys on every entry: url, kind,
# ref (the exact tag/branch/commit currently in use), pinned_at (the
# date, YYYY-MM-DD, this ref was last set or verified). `commit` gives
# the ref's resolved SHA where that's not already what `ref` itself is.
#
# TOML: parse with any TOML library (Python's stdlib `tomllib`, `toml`
# crate, `yq -p toml`, ...), or by eye/grep -- every value sits on its
# own `key = "value"` line.
#
# Update this file in the same commit that changes a pin. See each
# entry's own `tracking_doc` (if any) for the fuller writeup/checklist.

[portage]
description = "Upstream Gentoo Portage. This repository IS a fork of it -- PORTING/ (the Python-to-Rust port) is layered on top by rebase, never merge; bin/*.sh, lib/portage, lib/_emerge etc. are upstream's own tree, only touched where PORTING/ needs a real behavioral fix (e.g. brush strategy #2)."
url = "https://github.com/gentoo/portage"
remote = "gentoo"
kind = "upstream-fork-base"
ref = "refs/tags/portage-3.0.82.2"
# `commit` is the tag's *underlying commit*, not the annotated tag
# object -- `git rev-parse refs/tags/<ref>` returns the tag object;
# `git rev-parse refs/tags/<ref>^{commit}` (or `git log -1 <ref>`)
# returns this. `git merge-base --is-ancestor <this commit> rust` and
# `git describe --tags --match 'portage-*'` on `rust` (reads
# `portage-3.0.82.2-<n>-g<sha>`) are how to re-verify this entry.
commit = "1d95fc2c552a2c7d347e54093fa0e5b172a57004"
pinned_at = "2026-09-01"
# Update this whenever `rust` is rebased onto a newer upstream tag (a
# new tag is always imported by rebasing PORTING/'s commits on top of
# it, never a merge -- see `git log --grep prepare.for.portage` for the
# upstream "prepare for release" commits that mark each tag).
#
# `vendored_paths`: files copied from this ref into PORTING/ so `portuale`
# can run them with no Portage installed (the rest is still read from the
# surrounding checkout / a future gitignored 3rdparty/portage). Re-sync
# on each `commit` bump: copy the upstream file over PORTING/<path>, then
# re-apply the local change noted in that file's own header. portuale's
# `ebuild_phases::bin_dir()` overlays PORTING/bin/ on top of the
# checkout's bin/, vendored file wins.
vendored_paths = [
    "PORTING/bin/phase-functions.sh",  # local: brush strategy #2 (__save_and_filter_ebuild_env)
]

[brush]
description = "Rust-native bash interpreter (brush-core + brush-builtins), embedded in portuale as the real ebuild phase execution backend (bin/*.sh phases run through it, not a shelled-out system bash)."
url = "https://github.com/reubeno/brush"
kind = "cargo-git-dependency"
ref = "main"
commit = "a04b09dc4a3f5beaa78899c4100734cf0f8f4472"
pinned_in = "PORTING/rust/portuale/Cargo.toml"
pinned_at = "2026-09-01"
tracking_doc = "PORTING/BRUSH_PIN.md"
# No fork: plain upstream `main`, exact-commit pinned (no released
# crates.io version yet carries reubeno/brush#1274, which this pilot's
# use of bin/eapi.sh needs). Re-pin periodically -- see
# PORTING/BRUSH_PIN.md's checklist.
notes = "Was vivo75/brush (a fork) until 2026-09-01; dropped once both fixes the fork carried were resolved (see tracking_doc)."
