# Third-party repositories portuale checks out (into 3rdparty/, gitignored)
# or vendors (into the tree), and the exact ref/commit each is pinned to.
#
# One [table] per repository. Keys: url, kind, ref (branch/tag/commit in
# use), commit (the ref's resolved SHA -- for an annotated tag this is
# `git rev-parse <ref>^{commit}`, not the tag object), pinned_at
# (YYYY-MM-DD this was last set/verified). `checkout_path` is where the
# working tree lives (relative to repo root); `$PORTUALE_PORTAGE_CHECKOUT`
# overrides the portage one at runtime.
#
# TOML: parse with any TOML library (Python stdlib `tomllib`, the `toml`
# crate, `yq -p toml`, ...), or by eye -- every value is on its own line.
#
# Update this file in the same commit that changes a pin.

[portage]
description = "Upstream Gentoo Portage. portuale vendors the whole bash phase runtime into ./bin/ (see bin/README.md), but the .py helpers that `import portage` (doins.py, xpak-helper.py, ...), their lib/portage import path, and cnf/sets/portage.conf still come from this checkout. The Python reference (python/emerge_pretend_reference.py) also imports the real portage.dep etc. from here."
url = "https://github.com/gentoo/portage"
kind = "reference-checkout"
checkout_path = "3rdparty/portage"
# CURRENT CHECKOUT: `master` (a rolling branch), at the commit below.
# RECOMMENDED: pin a release tag instead for reproducibility --
# `git -C 3rdparty/portage checkout portage-3.0.82.2` (commit
# 1d95fc2c552a2c7d347e54093fa0e5b172a57004) and update `ref`/`commit`
# here. The full test suite is green against both.
ref = "master"
commit = "b675df82993be903dd45c5f46db0e800856ba65c"
pinned_at = "2026-09-01"
# Vendored into the tree (so `emerge` runs with no Portage installed):
#   bin/  -- ebuild.sh + its whole source closure, every ebuild-helpers/
#            script, estrip/ecompress, the *-qa-check.d/ sets, and the
#            stdlib-only filter-bash-environment.py. Only bin/phase-functions.sh
#            diverges (brush strategy #2 -- see its header). Re-sync on a
#            `commit` bump by copying the upstream files over + re-applying
#            that one change; `diff -r 3rdparty/portage/bin bin` should
#            then be empty bar phase-functions.sh + bin/README.md.
vendored_paths = ["bin/"]

[brush]
description = "Rust-native bash interpreter (brush-core + brush-builtins), embedded in portuale as the real ebuild phase execution backend (bin/*.sh phases run through it, not a shelled-out system bash)."
url = "https://github.com/reubeno/brush"
kind = "cargo-git-dependency"
checkout_path = "3rdparty/brush"
ref = "main"
commit = "a04b09dc4a3f5beaa78899c4100734cf0f8f4472"
pinned_in = "rust/portuale/Cargo.toml"
pinned_at = "2026-09-01"
tracking_doc = "BRUSH_PIN.md"
# No fork: plain upstream `main`, exact-commit pinned (no released
# crates.io version yet carries reubeno/brush#1274, which portuale's use
# of bin/eapi.sh needs). Cargo.toml still fetches this via git; the
# 3rdparty/brush checkout is for hacking/reference. Re-pin periodically --
# see BRUSH_PIN.md's checklist.
notes = "Was vivo75/brush (a fork) until 2026-09-01; dropped once both fixes the fork carried were resolved (see tracking_doc)."
