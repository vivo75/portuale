[package]
name = "portage-fetch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Real Manifest2 digest verification (lib/portage/manifest.py's own
# MANIFEST2_HASH_DEFAULTS = {"BLAKE2B", "SHA512"}) -- another deliberate,
# documented dependency, same waiver as brush-core/regex/md-5/filetime in
# portuale's own Cargo.toml.
blake2 = "0.10"
sha2 = "0.10"
# Real mirror `filename-hash` layouts (`layout.rs`) may name any of real
# `checksum_str`'s hashes; MD5/SHA-1 come from the same RustCrypto family,
# both already in Cargo.lock via portuale.
md-5 = "0.10"
sha1 = "0.10"
