[package]
name = "portuale"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
portage-util = { path = "../portage-util" }
portage-dep = { path = "../portage-dep" }
portage-repo = { path = "../portage-repo" }
# feat#157 (#305): the installed-package database interface; the merge
# writes its VDB entry through `portage_vdb::for_root(root)` (S1.4).
portage-vdb = { path = "../portage-vdb" }
portage-profile = { path = "../portage-profile" }
portage-fetch = { path = "../portage-fetch" }
portage-use-reduce = { path = "../portage-use-reduce" }
# The `mrg` director's `SchedulerPolicy` contract: `run_build_scheduler`
# dispatches through it (capped `LoadAwarePolicy` vs uncapped
# `UnlimitedPolicy`) instead of an inline jobs/load gate. A path
# dependency on a workspace crate, like every other portage-* entry
# above -- no new external fetch, musl-static story untouched.
mrg-director = { path = "../mrg-director" }
# Real `cpv_sort_key()` version ordering for `--unmerge`/`-C`'s own
# `selected`/`omitted`/`All selected packages` display (real
# `_emerge/unmerge.py::_unmerge_display`) -- a pure version-parsing
# crate, already a transitive dependency via portage-dep/portage-repo.
portage-versions = { path = "../portage-versions" }
# Real ebuild phase execution (task #54, docs/agent-context.md's own
# "Real ebuild phase execution" section): a deliberate, accepted dynamic
# dependency (this pilot's own "near-zero dependencies" discipline is
# explicitly waived here, see that doc's own "bash-execution-backend
# question" writeup) -- pinned by exact commit to the thin fork
# `vivo75/brush`: upstream `reubeno/brush` `main` plus the five staged
# `docs/brush-pr/` fixes, nothing else. No released crates.io version
# carries reubeno/brush#1274 (which portuale's use of `bin/eapi.sh`
# needs) or any of the staged fixes, which is why the pin is a git rev.
# The staged fixes:
#   - brace-less function bodies (`name() [[ ... ]]`, used ~60 times by
#     bin/eapi.sh): MERGED upstream as reubeno/brush#1274 (18851e7).
#   - parser: a `${…}`/`$(…)` on a here-tag line stole the pending
#     here-document's tokens (fix 01).
#   - parser: `declare -f` here-document serialization -- body placement,
#     quoted terminators; this is the one that unblocked `--shell brush`
#     phase save/restore (fix 02).
#   - core: a function used as a non-last pipeline stage ran inline and
#     deadlocked past one pipe buffer (fix 03; a re-do of the
#     still-open reubeno/brush#1276 -- `bin/phase-functions.sh`'
#     strategy-#2 rewrite keeps portage's own tree off that path).
#   - core: a parse error in a *sourced* file no longer exits the
#     calling shell, so real `source "${T}/environment" || die` fires
#     (fix 04).
#   - core: brace expansion produces its fields independently of IFS,
#     as bash does -- `__filter_readonly_variables`' special-variable
#     list is built under `local IFS` (fix 05). Its implementation is
#     upstream now (reubeno/brush#988 "improve IFS support"), so the
#     fork carries only fix 05's regression coverage for the `IFS=`
#     case.
#   - builtins: the declaration builtins (`export`/`declare`/`local`/
#     `readonly`/`typeset`) assignment-expand an expanded name
#     (`export ${var}=value` assigned after expansion, per POSIX XCU
#     2.9.1, instead of silently no-op'ing) (fix 06, backlog #94).
#     Upstream reubeno/brush#1280 reworks this wholesale and is still a
#     Draft, so the fork carries the small builtin-local fix instead.
# See docs/brush-pin.md for the tracking record and the periodic re-pin
# checklist (bump the rev to a newer `main`, re-run the suite).
brush-core = { git = "https://github.com/vivo75/brush", rev = "eb3b6c7bfdc3720ae5329f9d3336bbb9576a4c33" }
brush-builtins = { git = "https://github.com/vivo75/brush", rev = "eb3b6c7bfdc3720ae5329f9d3336bbb9576a4c33" }
# "rt-multi-thread", not just "rt": a single-threaded runtime deadlocks
# partway through a real multi-phase run (confirmed empirically -- see
# ebuild_phases::run_commands's own doc comment) -- brush-core's own
# Cargo.toml requires this exact feature under unix too.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
regex = "1"
# Real FEATURES=compress-build-logs (`prepare_build_dirs.py`'s own
# `.gz`-suffixed log paths + `EbuildPhase._open_log`'s gzip stream):
# phase output is gzip-encoded into the `.gz` log through a pure-Rust
# pump thread, and failure tails decode it back -- flate2 over
# miniz_oxide only (no C linkage, so the musl-static story is
# untouched; already in Cargo.lock via brush). Same waiver as md-5
# above.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Real merge/filesystem mutation (task #55, first slice): CONTENTS's own
# "obj" lines record a real MD5 digest of each merged regular file
# (mergeme()'s own `perform_md5`, `lib/portage/checksum.py`) -- another
# deliberate, documented dependency, same waiver as brush-core/regex
# above.
md-5 = "0.10"
# Binpkg `Packages` `SHA1` (real `bintree._pkgindex_hashes = ["MD5",
# "SHA1"]`) -- RustCrypto's pure-Rust SHA-1, same waiver as md-5 above:
# zero C linkage, so the musl-static story is untouched. Legacy-interop
# use only (SHA-1 is cryptographically broken); real portage writes and
# verifies it, so portuale does too.
sha1 = "0.10"
# Merge-time binpkg digest verification (backlog #174) checks every
# digest a `Packages` record may carry, not just real's own two
# (`MD5`/`SHA1` above): `SHA256`/`SHA512` when present. Same waiver as
# md-5 above (pure Rust, no C linkage); already locked (was a
# dev-dependency for the `Manifest` digest tests) -- no new fetch.
sha2 = "0.10"
# Real merge: real movefile() explicitly preserves the source's own
# mtime onto the merged destination (`newmtime=thismtime`) -- std::fs::
# copy doesn't (the destination gets a fresh "now" mtime), which would
# otherwise make CONTENTS's own recorded mtime never match the real file
# on disk, silently breaking unmerge's own real "!mtime" staleness
# check (see ebuild_unmerge.rs's own module doc comment). No std
# equivalent exists (stable std::fs has no mtime setter at all, let
# alone one for symlinks specifically -- filetime::set_symlink_file_times
# is used for those); another deliberate, documented dependency, same
# waiver as brush-core/regex/md-5 above.
filetime = "0.2"
# Real FEATURES=distlocks (lib/portage/locks.py's own lockfile()): a
# real, blocking flock(2) exclusive lock -- no std equivalent exists
# (stable std::fs has no flock wrapper at all), another deliberate,
# documented dependency, same waiver as brush-core/regex/md-5/filetime
# above. Already a transitive dependency (tokio/brush-core both pull it
# in) at this exact version -- declared directly here rather than
# relying on that, the same "don't depend on an undeclared transitive"
# reasoning that applies to any direct API use of another crate.
libc = "0.2"
# Real `gpkg.unpack_metadata` reads the inner `metadata.tar` with Python
# `tarfile` -- in process, resolving a symlink/hardlink *inside* the
# archive and returning `None` for a FIFO/device, so no host file can be
# reached (#58). The `tar` crate does the same for portuale: every inner
# member is judged from its own header (type, link name, bytes) before
# anything touches the filesystem. `default-features = false` drops the
# `xattr` feature; the remaining `filetime`/`libc` (plus their `cfg-if`)
# are already in Cargo.lock via brush/tokio, so this adds no new
# transitive crate and no C linkage -- the musl-static story is
# untouched. GNU `tar` keeps unpacking the inner `image.tar`
# (ownership/permission/xattr/sparse semantics); `#58` S5 moves the
# outer container over too.
tar = { version = "0.4", default-features = false }
# Real `gpkg._record_checksum` writes `BLAKE2B` (+ `SHA512`, `sha2`
# above) into the container `Manifest` (#326 S4's native
# `helpers/gpkg.rs`). Pure Rust, already vendored and locked
# (portage-fetch depends on it at this version, and the gpkg Manifest
# tests used it as a dev-dependency) -- no new fetch.
blake2 = "0.10"
# The `mrg` applet (module mrg.rs) is deliberately allowed to use major,
# mainstream crates -- its requirements are NOT the tight emerge/ebuild
# ones (see mrg.rs's own module doc comment for the full waiver): clap
# gives it a real, conventional command-line option parser (the same
# short/long option surface as real emerge) instead of portuale's
# hand-rolled parser. Pure Rust, zero C linkage, so the musl-static
# story is untouched.
clap = "4"
# feat#157 (#305) S7: the read-only FUSE view of the installed-package
# database (`portuale vdb mount`). Optional (feature `vdb-fuse`), and
# WITHOUT fuser's `libfuse` feature: fuser then speaks the kernel protocol
# itself and mounts through the `fusermount3` helper, so no C library is
# linked and the musl-static story is untouched.
fuser = { version = "0.18", default-features = false, optional = true }

[features]
# feat#157 (#305): optional VDB backend features. Q6 default: vdb-sqlite
# and vdb-redb are ON in the default dev build, OFF in the minimal
# static build profile (S2.1, S5.1).
default = ["vdb-sqlite", "vdb-redb", "vdb-fuse"]
vdb-sqlite = ["portage-vdb/vdb-sqlite"]
vdb-redb = ["portage-vdb/vdb-redb"]
vdb-fuse = ["dep:fuser"]

[dev-dependencies]
# Test-only (#326 S3): decompress the `fixtures/helpers/filter-env`
# `in.bz2`/`out.bz2` oracle sides in-process. Same zero-C-linkage
# discipline as portage-repo's own `bzip2` dependency (0.6's default
# backend is trifectatechfoundation's pure-Rust libbz2-rs-sys; the C
# `bzip2-sys` backend is opt-in and NOT enabled): keep
# `grep -c bzip2-sys Cargo.lock` at 0 after any bump.
bzip2 = "0.6"
