[package]
name = "portage-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Follows @world and its dependencies and reports the version order of every package slot, and the slots no visible version satisfies."

[dependencies]
portage-dep = { path = "../portage-dep" }
portage-profile = { path = "../portage-profile" }
portage-repo = { path = "../portage-repo" }
portage-use-reduce = { path = "../portage-use-reduce" }
portage-vdb = { path = "../portage-vdb" }
portage-versions = { path = "../portage-versions" }
glob = "0.3"
shlex = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
