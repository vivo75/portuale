[package]
name = "experiment-pre-sort-atoms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Experiment front end of portage-world: the version order of every @world slot."

# Not a default workspace member (see the root `Cargo.toml`): a bare
# `cargo build` skips it. Build it explicitly with
# `cargo build --release -p experiment-pre-sort-atoms`.
[dependencies]
portage-repo = { path = "../portage-repo" }
portage-world = { path = "../portage-world" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
