# fixture binrepos.conf for --getbinpkg/--getbinpkgonly (real
# lib/portage/binrepo/config.py). A single binhost whose "Packages"
# index lives at <sync-uri>/Packages. `${PORTAGE_CONFIGROOT}` expands
# from the env (portuale's parse_binrepos convenience) so this fixture
# tree stays relocatable. `--pretend` refreshes the index like real
# (bintree._populate_remote runs even for pretend, backlog #192); for
# this `file://` binhost that refresh is a local read, so the suite
# stays hermetic. `verify-signature = false`: the fixture index carries
# no `PATH` fields, which Portage 3.0.83 drops from a verifying repo
# (`gpkg_only`, backlog #511); the binhost is unsigned, so opt out
# explicitly and keep every existing pin resolving.
[testbinhost]
sync-uri = file://${PORTAGE_CONFIGROOT}/binhost
priority = 1
verify-signature = false
