source /etc/make.local

# "-profweakflag": the "Config depth" slice's defaults-vs-conf ordering
# check -- dev-libs/profileuseweakpkg's profile-level package.use enables
# it, and make.conf (real configdict[conf]) must win, leaving it OFF.
USE="confflag -profweakflag"
PKGDIR="${PORTAGE_CONFIGROOT}/pkgdir"

# The embedded make.globals (backlog #384) turns on `news`, `binpkg-multi-instance`
# and the namespace sandboxes and sets PORTAGE_COMPRESS=bzip2. The contract pins were
# written for a quiet root (no unread-news notice, flat PKGDIR layout
# `<cat>/<pf>.gpkg.tar`, no unshare as an unprivileged user, uncompressed docs),
# all legal Portage configs.
FEATURES="-news -binpkg-multi-instance -network-sandbox -ipc-sandbox -pid-sandbox -usersandbox -userpriv"
PORTAGE_COMPRESS=""
